<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belief Review</title>
<style>
  :root { --bg:#f6f5f1; --panel:#fff; --ink:#1e1e1c; --muted:#6b6a64; --line:#e3e1d9; --accent:#2f5d8a;
          --rely:#2e7d4f; --note:#b8860b; --suspect:#d2691e; --contested:#b22222; --hyp:#4a5fbf; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.45 -apple-system, system-ui, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2 }
  header h1 { font-size:16px; margin:0 12px 0 0 }
  .census span { margin-right:10px; color:var(--muted) }
  .filters button { border:1px solid var(--line); background:#fff; padding:4px 10px; border-radius:14px; cursor:pointer; margin-right:4px }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink) }
  main { display:grid; grid-template-columns: 380px 1fr; height:calc(100vh - 49px) }
  #list { overflow:auto; border-right:1px solid var(--line); background:var(--panel) }
  .item { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer }
  .item:hover { background:#faf9f5 } .item.sel { background:#eef3f8 }
  .item .claim { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .item .meta { color:var(--muted); font-size:12px; margin-top:3px }
  .chip { display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:10px; color:#fff; margin-right:6px; vertical-align:1px }
  .RELY{background:var(--rely)} .NOTE{background:var(--note)} .SUSPECT{background:var(--suspect)} .CONTESTED{background:var(--contested)} .HYPOTHESIS{background:var(--hyp)}
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border:1px solid var(--line); border-radius:8px; color:var(--muted); margin-right:4px }
  .item.retired { opacity:.5 } .item.private .claim::before { content:"🔒 "; }
  #detail { overflow:auto; padding:20px 28px 60px }
  #detail h2 { font-size:19px; margin:0 0 6px; line-height:1.35 }
  .row { color:var(--muted); font-size:13px; margin-bottom:14px }
  textarea { width:100%; min-height:84px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:#fff }
  input[type=text] { width:100%; font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 18px }
  .actions button { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit }
  .actions button.primary { background:var(--rely); color:#fff; border-color:var(--rely) }
  .actions button.warn { background:var(--suspect); color:#fff; border-color:var(--suspect) }
  .actions button.danger { color:var(--contested); border-color:var(--contested) }
  .actions kbd { font-size:11px; color:var(--muted); margin-left:6px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px }
  section h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  pre { white-space:pre-wrap; font:12px/1.4 ui-monospace, Menlo, monospace; background:#faf9f5; padding:8px; border-radius:6px; margin:6px 0 0; max-height:260px; overflow:auto }
  .ev { margin-bottom:10px } .ev .name { font-weight:600 }
  .hist li { color:var(--muted); font-size:12.5px }
  .toast { position:fixed; bottom:16px; right:16px; background:var(--ink); color:#fff; padding:10px 14px; border-radius:6px; opacity:0; transition:opacity .2s }
  .toast.show { opacity:1 }
  .empty { color:var(--muted); padding:40px }
  .reason { color:var(--suspect); font-size:13px; margin:-8px 0 12px }
</style>
</head>
<body>
<header>
  <h1>Belief Review</h1>
  <div class="census" id="census"></div>
  <div class="filters" id="filters"></div>
  <div style="margin-left:auto;color:var(--muted);font-size:12px" id="progress"></div>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><div class="empty">Select a belief. Keys: ↑/↓ move · C confirm · R rephrase · P private · X retire</div></div>
</main>
<div class="toast" id="toast"></div>
<script>
let beliefs = [], filter = 'SUSPECT', selected = null, health = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

async function load(){
  const r = await fetch('/api/beliefs'); const j = await r.json();
  beliefs = j.beliefs; health = j.health; renderAll();
}
function visible(){
  return beliefs.filter(b => {
    if (filter==='ALL') return !b.retired;
    if (filter==='PRIVATE') return !b.ambient && !b.retired;
    if (filter==='RETIRED') return b.retired;
    return b.stance===filter && !b.retired;
  });
}
function renderAll(){
  const by = {}; beliefs.filter(b=>!b.retired).forEach(b=>by[b.stance]=(by[b.stance]||0)+1);
  $('#census').innerHTML = Object.entries(by).map(([k,v])=>`<span><span class="chip ${k}">${k}</span>${v}</span>`).join('')
    + `<span>🔒 ${beliefs.filter(b=>!b.ambient&&!b.retired).length}</span><span>retired ${beliefs.filter(b=>b.retired).length}</span>`;
  const fs = ['SUSPECT','NOTE','RELY','CONTESTED','HYPOTHESIS','ALL','PRIVATE','RETIRED'];
  $('#filters').innerHTML = fs.map(f=>`<button class="${f===filter?'on':''}" data-f="${f}">${f.toLowerCase()}</button>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f; renderAll();});
  const list = visible();
  $('#progress').textContent = `${list.length} shown · ${beliefs.length} total`;
  $('#list').innerHTML = list.map(b=>`
    <div class="item ${b.id===selected?'sel':''} ${b.retired?'retired':''} ${b.ambient?'':'private'}" data-id="${b.id}">
      <div class="claim">${esc(b.claim)}</div>
      <div class="meta"><span class="chip ${b.stance}">${b.stance}</span>${esc(b.cluster||'')} · ${b.volatility} · ${b.age_days ?? '?'}d</div>
    </div>`).join('') || '<div class="empty">Nothing here.</div>';
  document.querySelectorAll('.item').forEach(el=>el.onclick=()=>select(el.dataset.id));
  if (selected && !list.find(b=>b.id===selected)) { /* keep detail, item moved filters */ }
  renderDetail();
}
function select(id){ selected=id; renderAll(); const el=document.querySelector(`.item[data-id="${id}"]`); el&&el.scrollIntoView({block:'nearest'}); }
function renderDetail(){
  const b = beliefs.find(x=>x.id===selected);
  if (!b) return;
  const why = b.stance==='SUSPECT' ? `<div class="reason">Suspect: ${b.volatility} claim, ${b.age_days} days since last grounding (half-life ${({status:3,metric:21,preference:180,structural:365})[b.volatility]||'∞'}d). ${b.degraded_reason?'Also: '+esc(b.degraded_reason)+'.':''}</div>` : (b.degraded_reason?`<div class="reason">${esc(b.degraded_reason)}</div>`:'');
  $('#detail').innerHTML = `
    <h2>${esc(b.claim)}</h2>
    <div class="row"><span class="chip ${b.stance}">${b.stance}</span>
      <span class="tag">${esc(b.id)}</span><span class="tag">${b.method}</span><span class="tag">${b.volatility}</span><span class="tag">${esc(b.cluster||'')}</span>
      ${b.reconstructed?'<span class="tag">reconstructed</span>':''}${b.unsupported?'<span class="tag">unsupported</span>':''}
      ${b.ambient?'':'<span class="tag">🔒 private (not in MEMORY.md)</span>'}${b.retired?'<span class="tag">retired: '+esc(b.retired_reason)+'</span>':''}
      <br>observed ${b.observed_at||'?'} · verified ${b.verified_at||'never'} · ${b.age_days ?? '?'}d old${b.extractor?' · extracted by '+esc(b.extractor):''}
    </div>
    ${why}
    <textarea id="text" placeholder="Rephrase the claim here (only used by Rephrase)">${esc(b.claim)}</textarea>
    <div style="margin-top:8px"><input type="text" id="note" placeholder="Optional note — becomes part of the canonical record"></div>
    <div class="actions">
      <button class="primary" data-a="confirm">Confirm — still true<kbd>C</kbd></button>
      <button data-a="rephrase">Rephrase<kbd>R</kbd></button>
      ${b.ambient?'<button data-a="private">Make private<kbd>P</kbd></button>':'<button data-a="public">Make public<kbd>P</kbd></button>'}
      ${b.retired?'':'<button class="danger" data-a="retire">Retire<kbd>X</kbd></button>'}
      <button data-a="next">Skip<kbd>↓</kbd></button>
    </div>
    ${b.note?`<section><h3>Extractor note</h3>${esc(b.note)}</section>`:''}
    <section><h3>Evidence — why this is believed</h3>
      ${b.evidence.length?b.evidence.map(e=>`<div class="ev"><div class="name">${esc(e.name)} <span class="tag">${esc(e.role||'')}</span></div><pre>${esc(e.excerpt)}</pre></div>`).join(''):'<div class="row">no evidence linked (unsupported)</div>'}
      ${b.premise_ids.length?`<div class="row">premises: ${b.premise_ids.map(esc).join(', ')}</div>`:''}
    </section>
    ${b.claim_history.length>1?`<section><h3>Claim history</h3><ul class="hist">${b.claim_history.map(h=>`<li>${h.at} · ${h.origin}: ${esc(h.claim)}</li>`).join('')}</ul></section>`:''}
    ${b.relationships.length?`<section><h3>Relationships</h3><ul class="hist">${b.relationships.map(r=>`<li>${esc(r.subject)} <b>${r.rel}</b> ${esc(r.object)}${r.note?' — '+esc(r.note):''}</li>`).join('')}</ul></section>`:''}
    <section><h3>Canonical history</h3><ul class="hist">${b.history.map(h=>`<li>${h.at} · ${h.type}</li>`).join('')}</ul></section>`;
  document.querySelectorAll('.actions button').forEach(btn=>btn.onclick=()=>act(btn.dataset.a));
}
async function act(a){
  const b = beliefs.find(x=>x.id===selected); if(!b) return;
  if (a==='next') return move(1);
  const body = {id:b.id, action:a, note:$('#note').value, text:$('#text').value};
  if (a==='retire' && !confirm(`Retire "${b.claim.slice(0,80)}…"?\n(Recorded state — full history stays recoverable.)`)) return;
  const r = await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) return toast('✗ '+j.error);
  const i = beliefs.findIndex(x=>x.id===b.id); beliefs[i]=j.belief;
  toast(`✓ ${a}: ${b.id}`);
  const list = visible(); const idx = list.findIndex(x=>x.id===b.id);
  renderAll();
  // advance to the next item in the current filter if this one left it
  const after = visible(); if (!after.find(x=>x.id===b.id) && after.length) select(after[Math.min(idx, after.length-1)].id);
}
function move(d){ const list=visible(); const i=list.findIndex(x=>x.id===selected); const n=list[Math.max(0,Math.min(list.length-1,(i<0?0:i+d)))]; n&&select(n.id); }
document.addEventListener('keydown', e=>{
  if (['TEXTAREA','INPUT'].includes(document.activeElement.tagName)) return;
  if (e.key==='ArrowDown'||e.key==='j') { e.preventDefault(); move(1); }
  if (e.key==='ArrowUp'||e.key==='k') { e.preventDefault(); move(-1); }
  if (e.key==='c') act('confirm'); if (e.key==='r') $('#text').focus();
  if (e.key==='p') act(beliefs.find(x=>x.id===selected)?.ambient?'private':'public');
  if (e.key==='x') act('retire');
});
load().then(()=>{ const v=visible(); if(v.length) select(v[0].id); });
</script>
</body>
</html>
